# epic-checkinn-mvp — planned entries in build order. Table order is the build order; ids are never reused.

[[entry]]
id = 1
type = "story"
title = "App shell, design tokens and error pages"
description = "Builds the layout shell. Header (logo, Manage booking) and footer (fictional and illustrative-photos notice, Photo credits link) with skip link and landmarks; Poppins via next/font/local (AD-17); DESIGN.md tokens as the Tailwind theme; the inline SVG icon set; Stay and Party base types in src/domain/types.ts; error.tsx, not-found.tsx and the '%s · CheckInn' title template. Updates layout.test.tsx and e2e/home.spec.ts for the new shell."
verify = "With the network blocked, Home renders header, footer and Poppins; an unknown URL shows the not-found page; unit and e2e tests pass."
covers = ["CAP-1"]
after = []
hitl = true
risk = "low"
references = ["DESIGN.md", "_bmad-output/initiative-checkinn-mvp/architecture-checkinn/architecture-checkinn.md#ad-17--nothing-loads-from-the-network-except-seed-photos"]

[[entry]]
id = 2
type = "story"
title = "Tracer: database, seed and Home City tiles"
description = "Installs the data stack (ask first) and copies the seed to data/seed/. Adds the Drizzle schema and committed migration, and src/db/client.ts migrating and seeding on first access (AD-6, AD-12). Adds a Vitest :memory: seeded-DB helper and documents the seed-to-table mapping in the README. Home shows the 6 City tiles (catalog Hotel count, photo credit) through RemoteImage (AD-14), read with io() (AD-2). The tracer bullet: tile links point at /search, which entry 7 builds."
verify = "On a fresh clone npm run dev shows 6 tiles whose counts sum to 12. Blocked images show placeholders. A repo test on :memory: counts 12 Hotels. npm run build succeeds with no database file. home.spec tolerates failed seed-photo requests."
covers = ["CAP-1", "CAP-8"]
after = [1]
hitl = true
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Reset and e2e isolation"
description = "Adds npm run db:reset as a transactional wipe-and-reseed, safe while the app runs (AD-6). Playwright runs on a dedicated port with webServer.env.CHECKINN_DB_PATH set to a temp file, a reset in global setup, and serial booking-desktop then booking-mobile projects using unique guest emails (AD-18). Updates the e2e line in AGENTS.md Commands."
verify = "With npm run dev running, a manually inserted booking row is gone after npm run db:reset and the app still lists 12 Hotels. npm run test:e2e no longer touches data/checkinn.db."
covers = ["CAP-8"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Range calendar, occupancy picker and dialog primitive"
description = "Builds the client components for the range calendar (desktop popover, phone sheet, keyboard grid, aria names) and the occupancy steppers, emitting a Stay and a Party. Also the shared dialog/sheet primitive (focus trap, inert background, Escape) that entries 8, 9 and 13 reuse. Follows DESIGN.md, EXPERIENCE.md and mockups/key-calendar.html."
verify = "Component tests pick check-in and check-out by keyboard and by click, and enforce past days, the 30-night limit and the stepper limits with aria-disabled focus kept. The dialog primitive traps and restores focus."
covers = ["CAP-1"]
after = [1]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-checkinn-mvp/ux-checkinn/mockups/key-calendar.html"]

