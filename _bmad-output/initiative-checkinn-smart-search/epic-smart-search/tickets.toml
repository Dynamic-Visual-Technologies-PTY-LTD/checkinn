[[entry]]
id = 6
type = "story"
title = "Best-fit pre-selection on the Hotel page"
description = "Reads entry 5's bestFit parameter on the Hotel page and pre-selects that Room type at the URL's Rooms when sel is absent, a Provider is configured and the Room type still qualifies (AD-26 Hotel page). Shows the Best-fit chip and the booking-summary line, lets sel win once the Guest changes the selection, keeps every Smart parameter off the Hotel page and /book URLs (AD-21), does not enforce Max price, re-checks bestFit when Stay or Party change, and pre-selects nothing when the Room type no longer qualifies."
verify = "The UJ-1 e2e opens Winelands Family Lodge from its card with the Family Room selected, the chip shown and Reserve enabled; changing the quantity removes the summary line and keeps the chip; the Reserve URL to /book carries no Smart parameter or bestFit."
covers = ["FR-14"]
after = [5]
hitl = false
risk = "medium"
references = ["_bmad-output/initiative-checkinn-smart-search/ux-smart-search/mockups/key-hotel-bestfit.html"]

[[entry]]
id = 7
type = "story"
title = "Fallback, Try again and the interpretation cache"
description = "Adds the codec fallback parameter and turns every ProviderError and the interpretation timeout (5 s since 2026-10-21, first 2.5 s) into the fallback URL (AD-22 Outcomes) and adds runSmartSearch's fallback mode: Hard criteria from the URL, MVP order, MVP cards priced from the cheapest qualifying Room type (AD-20). Shows the fallback notice with Try again, which resubmits the Query (FR-2). Adds src/features/search/cache.ts with the bounded interpretation map and in-flight sharing (AD-28) that 2.5 and 2.6 extend."
verify = "An e2e spec submits a Query the fake does not know and sees the fallback notice, the usual order and the Query in the box; Try again resubmits it. Unit tests: a timed-out interpret falls back; two concurrent identical submits make one Provider call; a rejected call is not cached."
covers = ["FR-2", "FR-3", "FR-6", "FR-13"]
after = [6]
hitl = false
risk = "medium"
